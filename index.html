<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 매크로 대시보드</title>

  <!-- PWA / 홈 화면 앱 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="내주식관리">
  <meta name="theme-color" content="#141414">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      font-size: 13px;
      background: #141414;
      color: #e2e2e2;
      padding: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .header h1 { font-size: 15px; font-weight: 500; color: #e8e8e8; }
    .save-status { font-size: 10px; color: #555; transition: color 0.3s; }
    .save-status.saving { color: #888; }
    .save-status.saved  { color: #5a9e4a; }
    .save-status.error  { color: #d95a5a; }
    .backup-btn {
      font-size: 10px; font-family: inherit;
      background: none; border: 0.5px solid #333;
      border-radius: 4px; color: #666;
      padding: 3px 9px; cursor: pointer;
    }
    .backup-btn:hover { border-color: #555; color: #aaa; }
    /* ── Section ── */
    .section { margin-bottom: 18px; }
    .section-title {
      font-size: 10px;
      font-weight: 500;
      color: #777;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ── Timeline ── */
    .timeline-wrap { width: 100%; }
    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-rows: auto;
      width: 100%;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .timeline-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .tl-col:nth-child(n+7) .tl-quant {
        border-top: 2px solid #3d3d3d;
      }
    }

    .tl-col {
      display: grid;
      grid-template-rows: subgrid;
      grid-row: span 3;
      border-right: 0.5px solid #2e2e2e;
    }
    .tl-col:nth-child(6n) { border-right: none; }
    @media (min-width: 641px) {
      .tl-col:nth-child(6n) { border-right: 0.5px solid #2e2e2e; }
      .tl-col:last-child    { border-right: none; }
    }
    @media (max-width: 640px) {
      .tl-col:nth-child(12) { border-right: none; }
    }

    .tl-quant,
    .tl-market {
      padding: 5px 6px;
      font-size: 10px;
      line-height: 1.55;
      min-height: 44px;
      cursor: text;
      color: #c8c8c8;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .tl-quant  { background: #1d1d1d; border-bottom: 0.5px solid #2d2d2d; }
    .tl-market { background: #1a1a1a; }

    .tl-label {
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #e0e0e0;
      background: #2a2a2a;
      border-top: 0.5px solid #353535;
      border-bottom: 0.5px solid #353535;
    }

    /* ── Table ── */
    .month-table {
      width: 100%;
      border-collapse: collapse;
      border: 0.5px solid #2e2e2e;
      border-radius: 6px;
      overflow: hidden;
      background: #1c1c1c;
      table-layout: fixed;
    }
    .month-table th {
      background: #252525;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 500;
      text-align: left;
      border-bottom: 0.5px solid #2e2e2e;
      border-right: 0.5px solid #2a2a2a;
      color: #e0e0e0;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .month-table th:last-child { border-right: none; }

    .col-resizer {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 1;
    }
    .col-resizer:hover, .col-resizer.dragging {
      background: #3a6a9a;
    }
    .month-table td {
      vertical-align: top;
      border-bottom: 0.5px solid #242424;
      border-right: 0.5px solid #242424;
    }
    .month-table td:last-child { border-right: none; }
    .month-table tr:last-child td { border-bottom: none; }

    .month-label-cell {
      background: #222;
      font-weight: 500;
      font-size: 11px;
      color: #e0e0e0;
      text-align: center;
      vertical-align: middle;
      padding: 6px 4px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .month-label-cell:hover { background: #2a2a2a; }

    .toggle-arrow {
      display: inline-block;
      font-size: 8px;
      color: #666;
      margin-right: 3px;
      transition: transform 0.15s ease;
    }

    tr.collapsed .toggle-arrow { transform: rotate(-90deg); }
    tr.collapsed td:not(.month-label-cell) {
      padding: 0;
      overflow: hidden;
      border-bottom: none;
    }
    tr.collapsed .cell-view { display: none; }
    tr.collapsed { border-bottom: 0.5px solid #242424; }
    .delete-col { width: 22px; text-align: center; vertical-align: middle; padding: 0; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: #3a3a3a; font-size: 14px; line-height: 1;
      padding: 4px; display: block; width: 100%;
    }
    .delete-btn:hover { color: #d95a5a; }

    /* ── Cell content / editing ── */
    .cell-view {
      padding: 6px 8px;
      min-height: 58px;
      font-size: 11px;
      line-height: 1.6;
      cursor: text;
      color: #c8c8c8;
      word-break: break-word;
      outline: none;
      white-space: pre-wrap;
    }
    .cell-view:focus { outline: none; }
    .cell-view.placeholder::before { content: '입력'; color: #383838; pointer-events: none; display: block; }

    .tl-view {
      min-height: 44px;
      white-space: pre-wrap;
      word-break: break-word;
      outline: none;
    }
    .tl-view:focus { background: rgba(58,90,122,0.08); }
    .tl-view.placeholder::before {
      content: attr(data-ph);
      color: #4a4a4a;
      font-size: 9px;
      pointer-events: none;
      display: block;
    }

    /* ── Chips ── */
    .chip {
      display: inline-block;
      font-size: 9px; font-weight: 500;
      padding: 1px 6px; border-radius: 3px;
      margin: 0 2px 2px 0; line-height: 1.7;
      background: #1a3050; color: #7ab0e0;
    }
    .chip-orange { background: #2e1a08; color: #e8924a; }
    .chip-green  { background: #0e2414; color: #52c46e; }

    /* ── 이미지 라이트박스 ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.on { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 4px;
      object-fit: contain;
    }

    /* ── Add month button ── */
    .add-month-btn {
      margin-top: 8px;
      padding: 5px 14px;
      font-size: 11px;
      font-family: inherit;
      background: #1c1c1c;
      border: 0.5px solid #2e2e2e;
      border-radius: 4px;
      cursor: pointer;
      color: #777;
    }
    .add-month-btn:hover { background: #252525; color: #aaa; }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .col-resizer { display: none; }
    }


    /* ── 자유노트 ── */
    .free-note {
      background: #161616;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .free-note-area {
      min-height: 60px;
      font-size: 13px; color: #bbb; line-height: 1.6;
      outline: none;
      width: 100%; cursor: text;
      white-space: pre-wrap; word-break: break-word;
      font-family: inherit;
    }
    .free-note-area:empty::before {
      content: attr(data-ph); color: #333; pointer-events: none; display: block;
    }
    .free-note-area img {
      float: left;
      max-width: 48%; border-radius: 6px;
      margin: 2px 12px 6px 0; cursor: pointer;
    }
    .free-note-area::after { content: ''; display: block; clear: both; }
    .free-note-area > div, .free-note-area > p { display: inline; margin: 0; padding: 0; }
    .img-selected { outline: 2px solid #4a8ac4; outline-offset: 1px; }
    .img-toolbar {
      position: fixed; z-index: 9999;
      background: #222; border: 1px solid #333; border-radius: 6px;
      display: flex; align-items: center; gap: 2px; padding: 3px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }
    .img-toolbar button {
      background: transparent; border: none; color: #aaa;
      font-size: 11px; padding: 3px 8px; border-radius: 4px;
      cursor: pointer; white-space: nowrap;
    }
    .img-toolbar button:hover { background: #333; color: #fff; }
    .img-toolbar button.del { color: #f87171; }
    .img-toolbar button.del:hover { background: rgba(248,113,113,0.15); }
    @media (pointer: coarse) {
      .img-toolbar {
        position: fixed; bottom: 0; left: 0; right: 0; top: auto !important;
        border-radius: 12px 12px 0 0;
        justify-content: center; gap: 8px; padding: 10px 16px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      .img-toolbar button { font-size: 14px; padding: 6px 14px; }
      .img-resize-handle { display: none !important; }
      .img-size-btn { display: inline-flex !important; }
    }
    .img-resize-handle {
      position: fixed; z-index: 10000;
      width: 18px; height: 18px;
      background: #3a7ac4; border: 2px solid #fff;
      border-radius: 3px; cursor: nwse-resize;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      touch-action: none;
    }
    .img-size-btn { display: none; }
    .free-note-status { font-size:10px; color:#444; display:block; text-align:right; min-height:14px; margin-bottom:2px; transition:color 0.2s; }
    .free-note-status.saving { color:#f0a500; }
    .free-note-status.saved  { color:#4ade80; }

    /* ── contenteditable 안 링크 ── */
    .cell-link {
      color: #5a8fc4;
      text-decoration: underline;
      cursor: pointer;
      user-select: text;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>주식 매크로 대시보드</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="backup-btn" onclick="backupAll()">⬇ 백업</button>
      <span class="save-status" id="saveStatus">● 로딩 중...</span>
    </div>
  </div>

  <!-- 연간 타임라인 -->
  <div class="section">
    <div class="section-title">연간 일정</div>
    <div class="timeline-wrap">
      <div class="timeline-grid" id="timelineGrid"></div>
    </div>
  </div>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox" onclick="document.getElementById('lightbox').classList.remove('on')">
    <img id="lightboxImg" src="">
  </div>

  <!-- 자유노트2 -->
  <div class="free-note">
    <span class="free-note-status" id="note-status2"></span>
    <div class="free-note-area" id="free-note2" contenteditable="true"></div>
  </div>

  <!-- 월별 분석 -->
  <div class="section">
    <div class="section-title">월별 분석</div>
    <div class="table-wrap">
      <table class="month-table" id="monthTable">
        <colgroup id="tableColgroup">
          <col style="width:48px">
          <col>
          <col>
          <col>
        </colgroup>
        <thead>
          <tr>
            <th></th>
            <th>매크로·산업<div class="col-resizer" data-col="1"></div></th>
            <th>기업보고서<div class="col-resizer" data-col="2"></div></th>
            <th>최선호주<div class="col-resizer" data-col="3"></div></th>
          </tr>
        </thead>
        <tbody id="monthTableBody"></tbody>
      </table>
    </div>
    <button class="add-month-btn" onclick="addMonthRow()">＋ 월 추가</button>
  </div>

  <!-- 자유노트 -->
  <div class="free-note">
    <span class="free-note-status" id="note-status"></span>
    <div class="free-note-area" id="free-note" contenteditable="true"></div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ── Supabase 초기화 ──
    const SUPABASE_URL = 'https://mwpyzhshhrzpmdmmuhzb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13cHl6aHNoaHJ6cG1kbW11aHpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzOTU5NTAsImV4cCI6MjA5Mzk3MTk1MH0.5X-dN79ePafwDgNilGfa1mbYxRDeyBm4cTENcVfDMFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ── 저장 상태 ──
    function setStatus(state) {
      const el = document.getElementById('saveStatus');
      if (state === 'saving') { el.textContent = '● 저장 중...'; el.className = 'save-status saving'; }
      if (state === 'saved')  { el.textContent = '● 저장됨';    el.className = 'save-status saved'; }
      if (state === 'error')  { el.textContent = '● 저장 실패'; el.className = 'save-status error'; }
    }

    // ── Supabase Storage 이미지 업로드 ──
    async function uploadImage(blob) {
      const compressed = await new Promise(resolve => {
        const url = URL.createObjectURL(blob);
        const tmp = new Image();
        tmp.onload = () => {
          const MAX = 1200;
          let w = tmp.width, h = tmp.height;
          if (w > MAX || h > MAX) {
            if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
            else        { w = Math.round(w * MAX / h); h = MAX; }
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(tmp, 0, 0, w, h);
          URL.revokeObjectURL(url);
          c.toBlob(b => resolve(b), 'image/jpeg', 0.85);
        };
        tmp.src = url;
      });

      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
      const { data, error } = await db.storage
        .from('stock_images')
        .upload(fileName, compressed, { contentType: 'image/jpeg' });
      if (error) throw error;

      return db.storage.from('stock_images').getPublicUrl(data.path).data.publicUrl;
    }

    // ── Storage 이미지 삭제 ──
    async function deleteStorageImg(src) {
      if (!src || !src.includes('/stock_images/')) return;
      try {
        const path = src.split('/stock_images/')[1].split('?')[0];
        await db.storage.from('stock_images').remove([path]);
      } catch(e) { console.warn('Storage 삭제 실패:', e); }
    }

    function compressImage(file, maxW = 480) {
      return new Promise(resolve => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const ratio = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width  = Math.round(img.width  * ratio);
          canvas.height = Math.round(img.height * ratio);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', 0.65));
        };
        img.src = url;
      });
    }

    // ── 텍스트 렌더링 ──
    function renderContent(raw) {
      if (!raw) return '';
      const IMG = '[img:';
      let result = '';
      let i = 0;
      while (i < raw.length) {
        const imgIdx = raw.indexOf(IMG, i);
        if (imgIdx === -1) { result += escapeChip(raw.slice(i)); break; }
        result += escapeChip(raw.slice(i, imgIdx));
        const endIdx = raw.indexOf(']', imgIdx + IMG.length);
        if (endIdx === -1) { result += escapeChip(raw.slice(imgIdx)); break; }
        const token = raw.slice(imgIdx + IMG.length, endIdx);
        const pipeIdx = token.search(/\|(?:data:|https?:)/);
        let imgSrc, wStyle;
        if (pipeIdx > 0) {
          wStyle = 'width:' + token.slice(0, pipeIdx) + ';max-width:100%;';
          imgSrc = token.slice(pipeIdx + 1);
        } else {
          wStyle = 'max-width:100%;';
          imgSrc = token;
        }
        result += `<img src="${imgSrc}" class="cell-img" style="${wStyle}max-height:280px;display:block;margin:4px 0;border-radius:3px;cursor:pointer;">`;
        i = endIdx + 1;
      }
      return result;
    }

    function escapeChip(text) {
      if (!text) return '';
      const s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const Z = '​';
      return s
        .replace(/\[!([^\]\n]{1,60})\]/g, '<span class="chip chip-orange" contenteditable="false">$1</span>' + Z)
        .replace(/\[\?([^\]\n]{1,60})\]/g, '<span class="chip chip-green"  contenteditable="false">$1</span>' + Z)
        .replace(/\[([^\]\n]{1,60})\]/g,   '<span class="chip"             contenteditable="false">$1</span>' + Z)
        .replace(/(https?:\/\/[^\s<>"]+)/g, '<span class="cell-link" contenteditable="false" data-href="$1">$1</span>');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━
    //  타임라인
    // ━━━━━━━━━━━━━━━━━━━━━━
    const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    let timelineData = {};

    function buildTimeline() {
      const grid = document.getElementById('timelineGrid');
      grid.innerHTML = '';
      MONTHS.forEach((m, i) => {
        const col = document.createElement('div');
        col.className = 'tl-col';
        col.appendChild(makeTlCell(i + 1, 'quant', 'tl-quant', '퀀트일정'));
        const label = document.createElement('div');
        label.className = 'tl-label';
        label.textContent = m;
        col.appendChild(label);
        col.appendChild(makeTlCell(i + 1, 'market', 'tl-market', '시장메모'));
        grid.appendChild(col);
      });
    }

    function makeTlCell(month, field, cls, placeholder) {
      const wrap = document.createElement('div');
      wrap.className = cls;

      const view = document.createElement('div');
      view.className = 'tl-view';
      view.contentEditable = 'true';
      view.spellcheck = false;
      view.dataset.ph = placeholder;

      const text = (timelineData[month] || {})[field] || '';
      if (text) { view.innerHTML = renderContent(text); }
      else { view.classList.add('placeholder'); }

      wrap.appendChild(view);
      addChipInput(view);

      view.addEventListener('focus', () => { view.classList.remove('placeholder'); });

      view.addEventListener('blur', async () => {
        const newText = cellDomToRaw(view).replace(/^\n+|\n+$/g, '').trim();
        if (!timelineData[month]) timelineData[month] = { month };
        timelineData[month][field] = newText;
        if (newText) {
          view.innerHTML = renderContent(newText);
          view.classList.remove('placeholder');
        } else {
          view.innerHTML = '';
          view.classList.add('placeholder');
        }
        await saveTlMonth(month);
      });

      return wrap;
    }

    async function saveTlMonth(month) {
      setStatus('saving');
      const row = { month, quant: (timelineData[month] || {}).quant || '', market: (timelineData[month] || {}).market || '' };
      const { error } = await db.from('timeline').upsert(row, { onConflict: 'month' });
      error ? setStatus('error') : setStatus('saved');
    }

    async function loadTimeline() {
      buildTimeline();
      const { data, error } = await db.from('timeline').select('*');
      if (error) { console.error(error); return; }
      data.forEach(row => { timelineData[row.month] = row; });
      buildTimeline();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━
    //  월별 테이블
    // ━━━━━━━━━━━━━━━━━━━━━━
    let entries = [];
    const FIELDS = [
      { key: 'macro',    db: 'macro' },
      { key: 'company',  db: 'company' },
      { key: 'topPick',  db: 'top_pick' },
    ];

    function renderTable() {
      const tbody = document.getElementById('monthTableBody');
      tbody.innerHTML = '';
      const collapsedIds = new Set(JSON.parse(localStorage.getItem('collapsedMonths') || '[]'));

      entries.forEach(entry => {
        const tr = document.createElement('tr');
        if (collapsedIds.has(entry.id)) tr.classList.add('collapsed');

        const tdMonth = document.createElement('td');
        tdMonth.className = 'month-label-cell';

        const arrow = document.createElement('span');
        arrow.className = 'toggle-arrow';

    function cellDomToRaw(node) {
      let raw = '';
      node.childNodes.forEach(child => {
        if (child.nodeType === Node.TEXT_NODE) {
          raw += child.textContent.replace(/​/g, '');
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          const tag = child.tagName;
          if (tag === 'BR') {
            raw += '\n';
          } else if (tag === 'DIV' || tag === 'P') {
            if (raw.length > 0 && !raw.endsWith('\n')) raw += '\n';
            raw += cellDomToRaw(child);
          } else if (child.classList.contains('chip')) {
            const t = child.textContent;
            if (child.classList.contains('chip-orange')) raw += '[!' + t + ']';
            else if (child.classList.contains('chip-green'))  raw += '[?' + t + ']';
            else raw += '[' + t + ']';
          } else if (tag === 'IMG') {
            const w = child.style.width;
            raw += '[img:' + (w ? w + '|' : '') + child.src + ']';
          } else {
            raw += cellDomToRaw(child);
          }
        }
      });
      return raw;
    }

    function processChips(container) {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) {
        if (!n.parentElement?.classList.contains('chip') && /\[/.test(n.textContent)) nodes.push(n);
      }
      nodes.forEach(textNode => {
        const text = textNode.textContent;
        const re = /\[([!?]?)([^\]\n]{1,60})\]/g;
        let lastIdx = 0, m, hasChip = false;
        const frag = document.createDocumentFragment();
        while ((m = re.exec(text)) !== null) {
          if (m.index > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
          const prefix = m[1], label = m[2];
          let cls = 'chip';
          if (prefix === '!') cls = 'chip chip-orange';
          else if (prefix === '?') cls = 'chip chip-green';
          const span = document.createElement('span');
          span.className = cls; span.contentEditable = 'false'; span.textContent = label;
          frag.appendChild(span);
          frag.appendChild(document.createTextNode('​'));
          lastIdx = m.index + m[0].length;
          hasChip = true;
        }
        if (!hasChip) return;
        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
        textNode.parentNode.replaceChild(frag, textNode);
      });
    }

    function tryConvertChip() {
      const sel = window.getSelection();
      if (!sel?.rangeCount) return;
      const range = sel.getRangeAt(0);
      const node = range.startContainer;
      if (node.nodeType !== Node.TEXT_NODE) return;
      if (node.parentElement?.classList.contains('chip')) return;

      const text = node.textContent;
      const pos  = range.startOffset;
      const before = text.slice(0, pos);
      const m = before.match(/\[([!?]?)([^\]\n]{1,60})\]$/);
      if (!m) return;

      const matchStart = pos - m[0].length;
      const prefix = m[1], label = m[2];
      let cls = 'chip';
      if (prefix === '!') cls = 'chip chip-orange';
      else if (prefix === '?') cls = 'chip chip-green';

      const span = document.createElement('span');
      span.className = cls; span.contentEditable = 'false'; span.textContent = label;

      const beforeText = text.slice(0, matchStart);
      const afterText  = text.slice(pos);
      const parent = node.parentNode;
      const frag = document.createDocumentFragment();
      if (beforeText) frag.appendChild(document.createTextNode(beforeText));
      frag.appendChild(span);
      const zws = document.createTextNode('​');
      frag.appendChild(zws);
      if (afterText) frag.appendChild(document.createTextNode(afterText));
      parent.replaceChild(frag, node);

      const newRange = document.createRange();
      newRange.setStartAfter(zws); newRange.collapse(true);
      sel.removeAllRanges(); sel.addRange(newRange);
    }

    function addChipInput(el) {
      el.addEventListener('input', () => {
        const sel = window.getSelection();
        if (!sel?.rangeCount) return;
        const node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === Node.TEXT_NODE && node.textContent[sel.getRangeAt(0).startOffset - 1] === ']') {
          tryConvertChip();
        }
      });
    }

    function refreshCellView(cell, raw, entry, field) {
      if (raw && raw.trim()) {
        cell.innerHTML = renderContent(raw);
        cell.classList.remove('placeholder');
        cell.querySelectorAll('.cell-img').forEach(img => {
          registerImg(img, () => {
            deleteStorageImg(img.src);
            img.remove();
            const newRaw = cellDomToRaw(cell);
            cell.dataset.raw = newRaw;
            if (entry) entry[field] = newRaw;
            refreshCellView(cell, newRaw, entry, field);
            if (entry) saveEntry(entry);
          });
        });
      } else {
        cell.innerHTML = '';
        cell.classList.add('placeholder');
      }
    }

    function makeTableCell(entry, field) {
      const cell = document.createElement('div');
      cell.className = 'cell-view';
      cell.contentEditable = 'true';
      cell.spellcheck = false;
      cell.dataset.raw = entry[field] || '';
      refreshCellView(cell, entry[field] || '', entry, field);

      addChipInput(cell);

      cell.addEventListener('mousedown', e => {
        if (e.target.tagName === 'IMG') e.preventDefault();
      });

      cell.addEventListener('blur', async () => {
        const raw = cellDomToRaw(cell);
        cell.dataset.raw = raw;
        entry[field] = raw;
        refreshCellView(cell, raw, entry, field);
        await saveEntry(entry);
      });

      cell.addEventListener('paste', async e => {
        const imgItem = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith('image/'));
        if (!imgItem) return;
        e.preventDefault();
        setStatus('saving');
        try {
          const url = await uploadImage(imgItem.getAsFile());
          const img = document.createElement('img');
          img.src = url;
          img.className = 'cell-img';
          img.style.cssText = 'max-width:100%;max-height:280px;display:block;margin:4px 0;border-radius:3px;cursor:pointer;';
          registerImg(img, () => {
            deleteStorageImg(img.src);
            img.remove();
            const newRaw = cellDomToRaw(cell);
            cell.dataset.raw = newRaw;
            entry[field] = newRaw;
            refreshCellView(cell, newRaw, entry, field);
            saveEntry(entry);
          });
          insertImgAtCursor(img, cell);
          const raw = cellDomToRaw(cell);
          cell.dataset.raw = raw;
          entry[field] = raw;
          await saveEntry(entry);
        } catch(err) { console.error(err); setStatus('error'); }
      });

      return cell;
    }

    async function saveEntry(entry) {
      setStatus('saving');
      const row = {
        id: entry.id,
        month: entry.month,
        macro: entry.macro || '',
        company: entry.company || '',

    function getNextMonth() {
      if (entries.length === 0) {
        const d = new Date();

      const last = entries[entries.length - 1].month;
      const match = last.match(/(\d{4})년\s*(\d{1,2})월/);
      if (match) {
        let y = parseInt(match[1]), m = parseInt(match[2]) + 1;
        if (m > 12) { m = 1; y++; }
        return `${y}년 ${m}월`;

      return '';

    const DEFAULT_WIDTHS = [null, 380, 160, 120];
    const COL_VER = 'v3';
    if (localStorage.getItem('dashColVer') !== COL_VER) {

    function applyColWidths() {

    function initResizers() {
      document.querySelectorAll('.col-resizer').forEach(handle => {
        handle.addEventListener('mousedown', e => {
          e.preventDefault();
          const colIdx = parseInt(handle.dataset.col);
          const startX = e.clientX;
          const startW = colWidths[colIdx];
          handle.classList.add('dragging');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';

          function onMove(e) {
            const diff = e.clientX - startX;
            colWidths[colIdx] = Math.max(60, startW + diff);
            applyColWidths();
          }
          function onUp() {
            handle.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            localStorage.setItem('dashColWidths', JSON.stringify(colWidths));
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);

        });

      if (_imgHandle) {
        _imgHandle.style.top  = (r.bottom - 7) + 'px';
        _imgHandle.style.left = (r.right  - 7) + 'px';
      }
    }

    function openImgUI(img, onDelete) {
      closeImgUI();
      _imgSel = img;
      img.classList.add('img-selected');

      const bar = document.createElement('div');
      bar.className = 'img-toolbar';
      _imgToolbar = bar;

      const viewBtn = document.createElement('button');
      viewBtn.textContent = '🔍 크게 보기';
      viewBtn.onmousedown = e => e.preventDefault();
      const openLightbox = e => {
        e.stopPropagation(); e.preventDefault();
        document.getElementById('lightboxImg').src = img.src;
        document.getElementById('lightbox').classList.add('on');
        closeImgUI();
      };
      viewBtn.onclick = openLightbox;
      viewBtn.addEventListener('touchend', openLightbox);
      bar.appendChild(viewBtn);

      const sep0 = document.createElement('span');
      sep0.style.cssText = 'width:1px;background:#444;margin:2px 4px;align-self:stretch;display:inline-block;';
      sep0.className = 'img-size-btn';
      bar.appendChild(sep0);

      const mkSizeBtn = (label, delta) => {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.className = 'img-size-btn';
        btn.style.cssText = 'font-size:16px;padding:2px 8px;';
        btn.onmousedown = e => e.preventDefault();
        const doResize = e => {
          e.stopPropagation(); e.preventDefault();
          const cur = img.offsetWidth || 200;
          img.style.width = Math.max(40, cur + delta) + 'px';
          img.style.height = 'auto';
          img.closest('.free-note-area, .cell-view')?.dispatchEvent(new Event('blur'));
        };
        btn.onclick = doResize;
        btn.addEventListener('touchend', doResize);
        bar.appendChild(btn);
      };
      mkSizeBtn('−', -30);
      mkSizeBtn('＋', 30);

      if (onDelete) {
        const sep = document.createElement('span');
        sep.style.cssText = 'width:1px;background:#444;margin:2px 4px;align-self:stretch;display:inline-block;';
        bar.appendChild(sep);
        const delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.className = 'del';
        delBtn.onmousedown = e => e.preventDefault();
        const doDelete = e => { e.stopPropagation(); e.preventDefault(); closeImgUI(); onDelete(img); };
        delBtn.onclick = doDelete;
        delBtn.addEventListener('touchend', doDelete);
        bar.appendChild(delBtn);
      }
      document.body.appendChild(bar);

      const handle = document.createElement('div');
      handle.className = 'img-resize-handle';
      _imgHandle = handle;
      document.body.appendChild(handle);
      requestAnimationFrame(() => placeImgUI(img));

      handle.addEventListener('mousedown', ev => {
        ev.preventDefault(); ev.stopPropagation();
        const startX = ev.clientX, startW = img.offsetWidth || 200;
        document.body.style.cursor = 'nwse-resize';
        document.body.style.userSelect = 'none';
        const onMove = mv => {
          img.style.width = Math.max(40, startW + mv.clientX - startX) + 'px';
          img.style.height = 'auto';
          requestAnimationFrame(() => placeImgUI(img));
        };
        const onUp = () => {
          document.body.style.cursor = document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          img.closest('.free-note-area, .cell-view')?.dispatchEvent(new Event('blur'));
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      handle.addEventListener('touchstart', ev => {
        ev.preventDefault(); ev.stopPropagation();
        const t0 = ev.touches[0];
        const startX = t0.clientX, startW = img.offsetWidth || 200;
        const onMove = mv => {
          const t = mv.touches[0];
          img.style.width = Math.max(40, startW + t.clientX - startX) + 'px';
          img.style.height = 'auto';
          requestAnimationFrame(() => placeImgUI(img));
        };
        const onUp = () => {
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onUp);
          img.closest('.free-note-area, .cell-view')?.dispatchEvent(new Event('blur'));
        };
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
      }, { passive: false });
    }

    function registerImg(img, onDelete) {
      img.addEventListener('click', e => { e.stopPropagation(); openImgUI(img, onDelete); });
      img.addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); openImgUI(img, onDelete); });
    }

    document.addEventListener('click', closeImgUI);

    // contenteditable 안 링크 클릭 처리
    document.addEventListener('click', e => {
      const span = e.target.closest('span.cell-link');
      if (!span) return;
      e.preventDefault();
      e.stopPropagation();
      window.open(span.dataset.href, '_blank', 'noopener');
    });

    // ════════════════════════════════════════════════════════
    //  자유노트
    // ════════════════════════════════════════════════════════
    function compressBlob(blob, maxPx = 600) {
      return new Promise(resolve => {
        const url = URL.createObjectURL(blob);
        const tmp = new Image();
        tmp.onload = () => {
          let w = tmp.width, h = tmp.height;
          if (w > maxPx || h > maxPx) {
            if (w >= h) { h = Math.round(h * maxPx / w); w = maxPx; }
            else        { w = Math.round(w * maxPx / h); h = maxPx; }
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(tmp, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.70));
        };
        tmp.src = url;
      });
    }

    function recompressDataUrl(dataUrl, maxPx, quality) {
      return new Promise(resolve => {
        const tmp = new Image();
        tmp.onload = () => {
          let w = tmp.width, h = tmp.height;
          if (w > maxPx || h > maxPx) {
            if (w >= h) { h = Math.round(h * maxPx / w); w = maxPx; }
            else        { w = Math.round(w * maxPx / h); h = maxPx; }
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(tmp, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        tmp.onerror = () => resolve(dataUrl);
        tmp.src = dataUrl;
      });
    }

    function insertImgAtCursor(imgEl, area) {
      const sel = window.getSelection();
      if (sel?.rangeCount) {
        const r = sel.getRangeAt(0);
        r.deleteContents();
        const after = document.createTextNode('​');
        r.insertNode(after);
        r.insertNode(imgEl);
        r.setStartAfter(after);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        area.appendChild(imgEl);
      }
    }

    function reattachNoteImgs(area) {
      area.querySelectorAll('img').forEach(img => {
        registerImg(img, i => { deleteStorageImg(i.src); i.remove(); area.dispatchEvent(new Event('blur')); });
      });
    }

    function initNote(noteId, statusId, supabaseId) {
      const area = document.getElementById(noteId);
      const sts  = document.getElementById(statusId);

      function showStatus(state, msg) {
        sts.className = 'free-note-status' + (state ? ' ' + state : '');
        sts.textContent = msg || '';
        if (state === 'saved') setTimeout(() => { sts.textContent = ''; sts.className = 'free-note-status'; }, 1800);
      }

      async function save() {
        showStatus('saving', '저장 중...');
        processChips(area);
        try {
          const { error } = await db.from('study_notes').upsert({ id: supabaseId, content: area.innerHTML, updated_at: new Date().toISOString() });
          if (error) throw error;
          showStatus('saved', '✓');
        } catch(e) {
          console.error('노트 저장 실패:', e);
          showStatus('error', '저장 실패');
        }
      }

      async function load() {
        try {
          const { data, error } = await db.from('study_notes').select('content').eq('id', supabaseId).single();
          if (error && error.code !== 'PGRST116') { console.error('노트 로드 실패:', error); return; }
          if (data?.content) { area.innerHTML = data.content; reattachNoteImgs(area); }
        } catch(e) { console.error('노트 로드 에러:', e); }
      }

      addChipInput(area);

      area.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const sel = window.getSelection();
        if (!sel?.rangeCount) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const br = document.createElement('br');
        range.insertNode(br);
        range.setStartAfter(br);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      });

      area.addEventListener('blur', save);

      area.addEventListener('paste', async e => {
        const imgItem = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith('image/'));
        if (!imgItem) return;
        e.preventDefault();
        const blob = imgItem.getAsFile();
        if (!blob) return;
        showStatus('saving', '이미지 처리 중...');
        try {
          const img = document.createElement('img');
          img.src = await uploadImage(blob);
          registerImg(img, i => { deleteStorageImg(i.src); i.remove(); area.dispatchEvent(new Event('blur')); });
          insertImgAtCursor(img, area);
          await save();
        } catch(err) { console.error(err); showStatus('', ''); }
      });

      load();
    }



    // 자유노트 두 개 초기화
    initNote('free-note',  'note-status',  'freenote');
    initNote('free-note2', 'note-status2', 'freenote2');

    init();
  </script>
