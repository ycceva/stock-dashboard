<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 매크로 대시보드</title>

  <!-- PWA / 홈 화면 앱 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="내주식관리">
  <meta name="theme-color" content="#141414">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      font-size: 15px;
      background: #141414;
      color: #e2e2e2;
      padding: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .header h1 { font-size: 17px; font-weight: 500; color: #e8e8e8; }
    .save-status { font-size: 12px; color: #555; transition: color 0.3s; }
    .save-status.saving { color: #888; }
    .save-status.saved  { color: #5a9e4a; }
    .save-status.error  { color: #d95a5a; }
    .backup-btn {
      font-size: 12px; font-family: inherit;
      background: none; border: 0.5px solid #333;
      border-radius: 4px; color: #666;
      padding: 3px 9px; cursor: pointer;
    }
    .backup-btn:hover { border-color: #555; color: #aaa; }

    /* ── Section ── */
    .section { margin-bottom: 18px; }
    .section-title {
      font-size: 12px;
      font-weight: 500;
      color: #777;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ── Table ── */
    .month-table {
      width: 100%;
      border-collapse: collapse;
      border: 0.5px solid #2e2e2e;
      border-radius: 6px;
      overflow: hidden;
      background: #1c1c1c;
      table-layout: fixed;
    }
    .month-table th {
      background: #252525;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      border-bottom: 0.5px solid #2e2e2e;
      border-right: 0.5px solid #2a2a2a;
      color: #e0e0e0;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .month-table th:last-child { border-right: none; }

    /* 드래그 핸들 */
    .col-resizer {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 1;
    }
    .col-resizer:hover, .col-resizer.dragging {
      background: #3a6a9a;
    }
    .month-table td {
      vertical-align: top;
      border-bottom: 0.5px solid #242424;
      border-right: 0.5px solid #242424;
    }
    .month-table td:last-child { border-right: none; }
    .month-table tr:last-child td { border-bottom: none; }

    .month-label-cell {
      background: #222;
      font-weight: 500;
      font-size: 13px;
      color: #e0e0e0;
      text-align: center;
      vertical-align: middle;
      padding: 6px 4px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .month-label-cell:hover { background: #2a2a2a; }

    /* 접기/펴기 화살표 */
    .toggle-arrow {
      display: inline-block;
      font-size: 8px;
      color: #666;
      margin-right: 3px;
      transition: transform 0.15s ease;
    }

    /* 접힌 상태 */
    tr.collapsed .toggle-arrow { transform: rotate(-90deg); }
    tr.collapsed td:not(.month-label-cell) {
      padding: 0;
      overflow: hidden;
      border-bottom: none;
    }
    tr.collapsed .cell-view { display: none; }
    tr.collapsed { border-bottom: 0.5px solid #242424; }
    .delete-col { width: 22px; text-align: center; vertical-align: middle; padding: 0; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: #3a3a3a; font-size: 14px; line-height: 1;
      padding: 4px; display: block; width: 100%;
    }
    .delete-btn:hover { color: #d95a5a; }

    /* ── Cell content / editing ── */
    .cell-view {
      padding: 6px 8px;
      min-height: 58px;
      font-size: 14px;
      line-height: 1.6;
      cursor: text;
      color: #c8c8c8;
      word-break: break-word;
      outline: none;
      white-space: pre-wrap;
    }
    .cell-view:focus { outline: none; }
    .cell-view.placeholder::before { content: '입력'; color: #383838; pointer-events: none; display: block; }

    /* ── Chips ── */
    .chip {
      display: inline-block;
      font-size: 11px; font-weight: 500;
      padding: 1px 6px; border-radius: 3px;
      margin: 0 2px 2px 0; line-height: 1.7;
      background: #1a3050; color: #7ab0e0;
    }
    .chip-orange { background: #2e1a08; color: #e8924a; }
    .chip-green  { background: #0e2414; color: #52c46e; }

    /* ── URL 링크 ── */
    .cell-link {
      color: #5a8fc4;
      text-decoration: underline;
      cursor: pointer;
      word-break: break-all;
    }

    /* ── 이미지 라이트박스 ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.on { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 4px;
      object-fit: contain;
    }

    /* ── Add month button ── */
    .add-month-btn {
      margin-top: 8px;
      padding: 5px 14px;
      font-size: 13px;
      font-family: inherit;
      background: #1c1c1c;
      border: 0.5px solid #2e2e2e;
      border-radius: 4px;
      cursor: pointer;
      color: #777;
    }
    .add-month-btn:hover { background: #252525; color: #aaa; }

    /* 테이블 가로 스크롤 래퍼 */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    @media (max-width: 640px) {
      body { padding: 10px; }
      /* 모바일에서 드래그 핸들 숨김 */
      .col-resizer { display: none; }
    }


    /* ── 연간 캘린더 ── */
    .cal-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 0.5px solid #2e2e2e;
      border-radius: 6px;
      background: #1c1c1c;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(122px, 1fr));
      min-width: 1464px;
    }
    .cal-cell { border-right: 0.5px solid #242424; min-width: 0; padding-bottom: 6px; }
    .cal-cell:last-child { border-right: none; }
    .cal-head {
      display: flex; justify-content: space-between; align-items: baseline;
      background: #252525; padding: 6px 8px; margin-bottom: 4px;
      font-size: 13px; font-weight: 500; color: #e0e0e0;
      border-bottom: 0.5px solid #2e2e2e;
    }
    .cal-head small { font-size: 11px; font-weight: 400; color: #666; }
    .cal-cell.now .cal-head { background: #1a3050; color: #9cc8f0; }
    .cal-cell.now .cal-head small { color: #6a9fd8; }
    .cal-ev {
      font-size: 12px; line-height: 1.45; color: #c8c8c8;
      margin: 3px 6px 3px 6px; padding: 1px 0 1px 6px;
      border-left: 2px solid #444; word-break: keep-all;
    }
    .cal-ev .d { font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
    .cal-ev.m { border-left-color: #3a6a9a; } .cal-ev.m .d { color: #7ab0e0; }
    .cal-ev.x { border-left-color: #b8692e; } .cal-ev.x .d { color: #e8924a; }
    .cal-ev.e { border-left-color: #2f8a4a; } .cal-ev.e .d { color: #52c46e; }
    .cal-ev.f { border-left-color: #7a5aa8; } .cal-ev.f .d { color: #b48ae0; }
    .cal-ev { cursor: pointer; }
    .cal-ev:hover { background: #222; }
    .cal-modal-row { display: flex; gap: 8px; margin-top: 8px; }
    .cal-modal-row > * { flex: 1; min-width: 0; }
    .cal-modal-lbl { font-size: 11px; color: #777; margin: 8px 0 3px; display: block; }
    .cal-modal .auth-input { color-scheme: dark; }
    .cal-modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
    .cal-ev.past { opacity: 0.38; }
    .cal-ev.today { background: #262626; font-weight: 600; }
    .cal-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11px; color: #666; }
    .cal-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

    /* ── 미국 국채 금리 차트 ── */
    .rates-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
    .rates-range { display: flex; flex-wrap: wrap; gap: 4px; }
    .rates-range button {
      font-size: 11px; font-family: inherit; text-transform: none; letter-spacing: 0;
      background: none; border: 0.5px solid #333; border-radius: 4px;
      color: #777; padding: 2px 7px; cursor: pointer;
    }
    .rates-range button:hover { border-color: #555; color: #aaa; }
    .rates-range button.on { background: #1a3050; border-color: #3a6a9a; color: #9cc8f0; }
    @media (pointer: coarse) { .rates-range button { padding: 5px 9px; } }
    .rates-wrap { border: 0.5px solid #2e2e2e; border-radius: 6px; background: #1c1c1c; padding: 8px 6px 6px; }
    .rates-legend {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
      font-size: 12px; color: #999; padding: 0 6px 6px; min-height: 22px;
      font-variant-numeric: tabular-nums;
    }
    .rates-legend b { color: #e2e2e2; font-weight: 500; }
    .rates-legend i { display: inline-block; width: 12px; height: 1px; border-radius: 1px; margin-right: 5px; vertical-align: middle; }
    .rates-legend .date { color: #777; }
    .rates-legend .inv { color: #e66767; margin-left: 3px; font-size: 11px; }
    #ratesChart { height: 260px; }
    .rates-msg { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 12px; font-size: 13px; color: #aaa; }
    .rates-foot { font-size: 11px; color: #555; padding: 4px 6px 0; }

    /* ── 자유노트 ── */
    .free-note {
      background: #161616;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .free-note-area {
      min-height: 60px;
      font-size: 14px; color: #bbb; line-height: 1.6;
      outline: none;
      width: 100%; cursor: text;
      white-space: pre-wrap; word-break: break-word;
      font-family: inherit;
    }
    .free-note-area:empty::before {
      content: attr(data-ph); color: #333; pointer-events: none; display: block;
    }
    /* 자유노트 이미지: float으로 텍스트가 여러 줄 나란히 흐름 */
    .free-note-area img {
      float: left;
      max-width: 48%; border-radius: 6px;
      margin: 2px 12px 6px 0; cursor: pointer;
    }
    .free-note-area::after { content: ''; display: block; clear: both; }
    /* Chrome이 auto 생성하는 <div> 래퍼를 inline으로 → float 컨텍스트 유지 */
    .free-note-area > div, .free-note-area > p { display: inline; margin: 0; padding: 0; }
    .img-selected { outline: 2px solid #4a8ac4; outline-offset: 1px; }
    /* 데스크탑: 이미지 위에 떠있는 툴바 */
    .img-toolbar {
      position: fixed; z-index: 9999;
      background: #222; border: 1px solid #333; border-radius: 6px;
      display: flex; align-items: center; gap: 2px; padding: 3px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }
    .img-toolbar button {
      background: transparent; border: none; color: #aaa;
      font-size: 11px; padding: 3px 8px; border-radius: 4px;
      cursor: pointer; white-space: nowrap;
    }
    .img-toolbar button:hover { background: #333; color: #fff; }
    .img-toolbar button.del { color: #f87171; }
    .img-toolbar button.del:hover { background: rgba(248,113,113,0.15); }
    /* 모바일: 화면 하단 고정 바 */
    @media (pointer: coarse) {
      .img-toolbar {
        position: fixed; bottom: 0; left: 0; right: 0; top: auto !important;
        border-radius: 12px 12px 0 0;
        justify-content: center; gap: 8px; padding: 10px 16px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      .img-toolbar button { font-size: 14px; padding: 6px 14px; }
      .img-resize-handle { display: none !important; }
      .img-size-btn { display: inline-flex !important; }
    }
    .img-resize-handle {
      position: fixed; z-index: 10000;
      width: 18px; height: 18px;
      background: #3a7ac4; border: 2px solid #fff;
      border-radius: 3px; cursor: nwse-resize;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      touch-action: none;
    }
    .img-size-btn { display: none; }
    .free-note-status { font-size:10px; color:#444; display:block; text-align:right; min-height:14px; margin-bottom:2px; transition:color 0.2s; }
    .free-note-status.saving { color:#f0a500; }
    .free-note-status.saved  { color:#4ade80; }

    /* ── 로그인 ── */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 10001;
      background: #141414;
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .auth-overlay.on { display: flex; }
    .auth-box {
      background: #1e1e1e; border: 0.5px solid #333;
      border-radius: 10px; padding: 16px;
      width: 100%; max-width: 320px;
    }
    .auth-title { font-size: 14px; color: #ccc; margin-bottom: 10px; }
    .auth-input {
      width: 100%; font-size: 16px; font-family: inherit;
      background: #141414; color: #eee;
      border: 0.5px solid #333; border-radius: 6px;
      padding: 8px 10px; outline: none;
    }
    .auth-input:focus { border-color: #4a8ac4; }
    .auth-err { font-size: 12px; color: #ff8a8a; margin-top: 8px; min-height: 14px; }
    .auth-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  </style>
</head>
<body>

  <!-- 로그인 화면 -->
  <div class="auth-overlay" id="authView">
    <div class="auth-box">
      <div class="auth-title">로그인이 필요합니다</div>
      <input type="email" id="authEmail" class="auth-input" placeholder="이메일" autocomplete="email" spellcheck="false">
      <input type="password" id="authPassword" class="auth-input" placeholder="비밀번호" autocomplete="current-password" style="margin-top:8px;">
      <div class="auth-err" id="authErr"></div>
      <div class="auth-actions">
        <button class="backup-btn" onclick="loginWithPassword()">로그인</button>
      </div>
    </div>
  </div>

  <div id="appRoot" style="display:none">

  <div class="header">
    <h1>주식 매크로 대시보드</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="backup-btn" onclick="backupAll()">⬇ 백업</button>
      <button class="backup-btn" id="logoutBtn" onclick="logout()" style="display:none">로그아웃</button>
      <span class="save-status" id="saveStatus">● 로딩 중...</span>
    </div>
  </div>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox" onclick="document.getElementById('lightbox').classList.remove('on')">
    <img id="lightboxImg" src="">
  </div>

  <!-- 연간 캘린더: 이번 달부터 12개월 -->
  <div class="section">
    <div class="section-title" style="display:flex;align-items:center;gap:10px;">
      <span>연간 캘린더</span>
      <button class="backup-btn" style="text-transform:none;letter-spacing:0;" onclick="openCalEditor(null)">＋ 일정 추가</button>
    </div>
    <div class="cal-wrap"><div class="cal-grid" id="calGrid"></div></div>
    <div class="cal-legend">
      <span><i style="background:#3a6a9a"></i>매크로·통화</span>
      <span><i style="background:#b8692e"></i>만기·리밸런싱</span>
      <span><i style="background:#2f8a4a"></i>실적·기업행사</span>
      <span><i style="background:#7a5aa8"></i>펀드·휴장·기타</span>
      <span>~ 표시는 예상(미확정) 일정 · 흐린 글씨는 지난 일정 · 일정을 누르면 수정</span>
      <span id="calSrc"></span>
    </div>
  </div>

  <!-- 미국 국채 금리 (FRED 10년·2년·3개월) -->
  <div class="section">
    <div class="section-title rates-head">
      <span>미국 국채 금리 · 장단기</span>
      <span class="rates-range" id="ratesRange"></span>
    </div>
    <div class="rates-wrap">
      <div class="rates-legend" id="ratesLegend"></div>
      <div id="ratesChart"><div class="rates-msg">금리 불러오는 중...</div></div>
      <div class="rates-foot" id="ratesFoot">출처: FRED (DGS10 · DGS2 · DGS3MO), 일별 · 차트에 마우스를 올리거나 누르면 그날 값</div>
    </div>
  </div>

  <!-- 캘린더 일정 추가/수정 창 -->
  <div class="auth-overlay cal-modal" id="calModal">
    <div class="auth-box" style="max-width:340px;">
      <div class="auth-title" id="calModalTitle">일정 추가</div>
      <div class="cal-modal-row">
        <div><label class="cal-modal-lbl" for="calStart">시작일</label><input type="date" id="calStart" class="auth-input"></div>
        <div><label class="cal-modal-lbl" for="calEnd">종료일 (선택)</label><input type="date" id="calEnd" class="auth-input"></div>
      </div>
      <label class="cal-modal-lbl" for="calTitle">내용</label>
      <input type="text" id="calTitle" class="auth-input" placeholder="예: 엔비디아 실적" spellcheck="false">
      <label class="cal-modal-lbl" for="calCat">분류</label>
      <select id="calCat" class="auth-input">
        <option value="m">매크로·통화</option>
        <option value="x">만기·리밸런싱</option>
        <option value="e">실적·기업행사</option>
        <option value="f">펀드·휴장·기타</option>
      </select>
      <label class="cal-modal-lbl" style="display:flex;align-items:center;gap:6px;color:#aaa;font-size:13px;margin-top:12px;">
        <input type="checkbox" id="calApprox"> 예상(미확정) — 날짜 앞에 ~ 표시
      </label>
      <div class="auth-err" id="calErr"></div>
      <div class="cal-modal-actions">
        <button class="backup-btn" id="calDelBtn" style="color:#d95a5a;border-color:#4a2a2a;" onclick="deleteCalEvent()">삭제</button>
        <span style="display:flex;gap:8px;">
          <button class="backup-btn" onclick="closeCalEditor()">취소</button>
          <button class="backup-btn" style="color:#9cc8f0;border-color:#3a6a9a;" onclick="saveCalEvent()">저장</button>
        </span>
      </div>
    </div>
  </div>

  <!-- 자유노트2 -->
  <div class="free-note">
    <span class="free-note-status" id="note-status2"></span>
    <div class="free-note-area" id="free-note2" contenteditable="true"></div>
  </div>

  <!-- 월별 분석 -->
  <div class="section">
    <div class="section-title">월별 분석</div>
    <div class="table-wrap">
      <table class="month-table" id="monthTable">
        <colgroup id="tableColgroup">
          <col style="width:44px">
          <col>
          <col style="width:25%">
        </colgroup>
        <thead>
          <tr>
            <th></th>
            <th>매크로·산업<div class="col-resizer" data-col="1"></div></th>
            <th>기업보고서<div class="col-resizer" data-col="2"></div></th>
          </tr>
        </thead>
        <tbody id="monthTableBody"></tbody>
      </table>
    </div>
    <button class="add-month-btn" onclick="addMonthRow()">＋ 월 추가</button>
  </div>


  <!-- 자유노트 -->
  <div class="free-note">
    <span class="free-note-status" id="note-status"></span>
    <div class="free-note-area" id="free-note" contenteditable="true"></div>
  </div>

  </div><!-- /appRoot -->

  <!-- Supabase SDK -->

  <!-- 금리 차트 -->

    // ── Supabase Storage 이미지 업로드 ──
    // blob → 압축 → stock_images 버킷 업로드 → 공개 URL 반환
    async function uploadImage(blob) {
      // 1) 압축 (1200px, 0.85 — 글자 선명하게 유지)
      const compressed = await new Promise(resolve => {
        const url = URL.createObjectURL(blob);
        const tmp = new Image();
        tmp.onload = () => {
          const MAX = 1200;
          let w = tmp.width, h = tmp.height;
          if (w > MAX || h > MAX) {
            if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
            else        { w = Math.round(w * MAX / h); h = MAX; }
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(tmp, 0, 0, w, h);
          URL.revokeObjectURL(url);
          c.toBlob(b => resolve(b), 'image/jpeg', 0.85);
        };
        tmp.src = url;
      });

      // 2) Storage 업로드
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
      const { data, error } = await db.storage
        .from('stock_images')
        .upload(fileName, compressed, { contentType: 'image/jpeg' });
      if (error) throw error;

      // 3) 공개 URL 반환
      return db.storage.from('stock_images').getPublicUrl(data.path).data.publicUrl;
    }

    // ── 구버전 호환용 (base64 재압축 — 혹시 남은 base64 이미지가 있을 경우) ──
    function compressImage(file, maxW = 480) {
      return new Promise(resolve => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const ratio = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width  = Math.round(img.width  * ratio);
          canvas.height = Math.round(img.height * ratio);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', 0.65));
        };
        img.src = url;
      });
    }

    // ── 텍스트 렌더링: [단어]→칩, [img:...]→이미지 ──
    function renderContent(raw) {
      if (!raw) return '';
      const IMG = '[img:';
      let result = '';
      let i = 0;
      while (i < raw.length) {
        const imgIdx = raw.indexOf(IMG, i);
        if (imgIdx === -1) { result += escapeChip(raw.slice(i)); break; }
        result += escapeChip(raw.slice(i, imgIdx));
        const endIdx = raw.indexOf(']', imgIdx + IMG.length);
        if (endIdx === -1) { result += escapeChip(raw.slice(imgIdx)); break; }
        const token = raw.slice(imgIdx + IMG.length, endIdx);
        // width|src 형식 파싱 (드래그로 조정된 사이즈 복원)
        const pipeIdx = token.search(/\|(?:data:|https?:)/);
        let imgSrc, wStyle;
        if (pipeIdx > 0) {
          wStyle = 'width:' + token.slice(0, pipeIdx) + ';max-width:100%;';
          imgSrc = token.slice(pipeIdx + 1);
        } else {
          wStyle = 'max-width:100%;';
          imgSrc = token;
        }
        result += `<img src="${imgSrc}" class="cell-img" style="${wStyle}max-height:280px;display:block;margin:4px 0;border-radius:3px;cursor:pointer;">`;
        i = endIdx + 1;
      }
      return result;
    }

    function escapeChip(text) {
      if (!text) return '';
      const s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // [!텍스트] → 주황, [?텍스트] → 초록, [텍스트] → 파랑
      // ​(제로폭 공백)를 칩 양옆에 삽입 → 커서가 칩 바로 옆에 표시됨
      const Z = '​';
      return s
        .replace(/\[!([^\]\n]{1,60})\]/g, '<span class="chip chip-orange" contenteditable="false">$1</span>' + Z)
        .replace(/\[\?([^\]\n]{1,60})\]/g, '<span class="chip chip-green"  contenteditable="false">$1</span>' + Z)
        .replace(/\[([^\]\n]{1,60})\]/g,   '<span class="chip"             contenteditable="false">$1</span>' + Z)
        .replace(/(https?:\/\/[^\s<>"]+)/g, (_, url) => {
          const safe = url.replace(/'/g, '%27').replace(/"/g, '&quot;');
          return `<span class="cell-link" contenteditable="false" onclick="event.stopPropagation();event.preventDefault();window.open('${safe}','_blank','noopener')">${url}</span>`;
        });
    }

    // DOM → raw 텍스트 변환 (칩·이미지 포함)
    function cellDomToRaw(node) {
      let raw = '';
      node.childNodes.forEach(child => {
        if (child.nodeType === Node.TEXT_NODE) {
          raw += child.textContent.replace(/​/g, ''); // 제로폭 공백 제거
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          const tag = child.tagName;
          if (tag === 'BR') {
            raw += '\n';
          } else if (tag === 'DIV' || tag === 'P') {
            if (raw.length > 0 && !raw.endsWith('\n')) raw += '\n';
            raw += cellDomToRaw(child);
          } else if (child.classList.contains('chip')) {
            const t = child.textContent;
            if (child.classList.contains('chip-orange')) raw += '[!' + t + ']';
            else if (child.classList.contains('chip-green'))  raw += '[?' + t + ']';
            else raw += '[' + t + ']';
          } else if (tag === 'IMG') {
            // 드래그로 바뀐 width도 저장: [img:200px|data:...]
            const w = child.style.width;
            raw += '[img:' + (w ? w + '|' : '') + child.src + ']';
          } else {
            raw += cellDomToRaw(child);
          }
        }
      });
      return raw;
    }

    // 자유노트 등 contentEditable에서 [text]/[!text]/[?text] → 칩 span으로 즉시 변환
    function processChips(container) {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) {
        if (!n.parentElement?.classList.contains('chip') && /\[/.test(n.textContent)) nodes.push(n);
      }
      nodes.forEach(textNode => {
        const text = textNode.textContent;
        const re = /\[([!?]?)([^\]\n]{1,60})\]/g;
        let lastIdx = 0, m, hasChip = false;
        const frag = document.createDocumentFragment();
        while ((m = re.exec(text)) !== null) {
          if (m.index > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
          const prefix = m[1], label = m[2];
          let cls = 'chip';
          if (prefix === '!') cls = 'chip chip-orange';
          else if (prefix === '?') cls = 'chip chip-green';
          const span = document.createElement('span');
          span.className = cls; span.contentEditable = 'false'; span.textContent = label;
          frag.appendChild(span);
          frag.appendChild(document.createTextNode('​'));
          lastIdx = m.index + m[0].length;
          hasChip = true;
        }
        if (!hasChip) return;
        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
        textNode.parentNode.replaceChild(frag, textNode);
      });
    }

    // ] 입력 시 커서 위치의 [xxx] 패턴을 즉시 칩으로 변환 (실시간)
    function tryConvertChip() {
      const sel = window.getSelection();
      if (!sel?.rangeCount) return;
      const range = sel.getRangeAt(0);
      const node = range.startContainer;
      if (node.nodeType !== Node.TEXT_NODE) return;
      if (node.parentElement?.classList.contains('chip')) return;

      const text = node.textContent;
      const pos  = range.startOffset;
      const before = text.slice(0, pos);
      const m = before.match(/\[([!?]?)([^\]\n]{1,60})\]$/);
      if (!m) return;

      const matchStart = pos - m[0].length;
      const prefix = m[1], label = m[2];
      let cls = 'chip';
      if (prefix === '!') cls = 'chip chip-orange';
      else if (prefix === '?') cls = 'chip chip-green';

      const span = document.createElement('span');
      span.className = cls; span.contentEditable = 'false'; span.textContent = label;

      const beforeText = text.slice(0, matchStart);
      const afterText  = text.slice(pos);
      const parent = node.parentNode;
      const frag = document.createDocumentFragment();
      if (beforeText) frag.appendChild(document.createTextNode(beforeText));
      frag.appendChild(span);
      const zws = document.createTextNode('​');
      frag.appendChild(zws);
      if (afterText) frag.appendChild(document.createTextNode(afterText));
      parent.replaceChild(frag, node);

      // 커서를 칩 바로 뒤로 이동
      const newRange = document.createRange();
      newRange.setStartAfter(zws); newRange.collapse(true);
      sel.removeAllRanges(); sel.addRange(newRange);
    }

    // contentEditable 요소에 ] 입력 감지 → 즉시 칩 변환 + 백스페이스 칩 삭제
    function addChipInput(el) {
      el.addEventListener('input', () => {
        const sel = window.getSelection();
        if (!sel?.rangeCount) return;
        const node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === Node.TEXT_NODE && node.textContent[sel.getRangeAt(0).startOffset - 1] === ']') {
          tryConvertChip();
        }
      });

      // 백스페이스/Delete로 칩 삭제
      el.addEventListener('keydown', e => {
        if (e.key !== 'Backspace' && e.key !== 'Delete') return;
        const sel = window.getSelection();
        if (!sel?.rangeCount || !sel.getRangeAt(0).collapsed) return;
        const range = sel.getRangeAt(0);
        const { startContainer: node, startOffset: offset } = range;

        let chipToDelete = null;

        if (e.key === 'Backspace') {
          if (node.nodeType === Node.TEXT_NODE) {
            // 커서가 텍스트 맨 앞이거나 제로폭 공백 바로 뒤인 경우
            const isAtEffectiveStart = offset === 0 ||
              (offset === 1 && node.textContent[0] === '​');
            if (isAtEffectiveStart) {
              const prev = node.previousSibling;
              if (prev?.nodeType === Node.ELEMENT_NODE && prev.classList.contains('chip')) {
                chipToDelete = prev;
                if (offset === 1) node.deleteData(0, 1); // ZWS 제거
              }
            }
          } else if (node.nodeType === Node.ELEMENT_NODE && offset > 0) {
            const prev = node.childNodes[offset - 1];
            if (prev?.nodeType === Node.ELEMENT_NODE && prev.classList.contains('chip')) {
              chipToDelete = prev;
            }
          }
        } else { // Delete
          if (node.nodeType === Node.TEXT_NODE) {
            const atEnd = offset >= node.textContent.replace(/​/g,'').length;
            if (atEnd) {
              const next = node.nextSibling;
              if (next?.nodeType === Node.ELEMENT_NODE && next.classList.contains('chip')) {
                chipToDelete = next;
              }
            }
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            const next = node.childNodes[offset];
            if (next?.nodeType === Node.ELEMENT_NODE && next.classList.contains('chip')) {
              chipToDelete = next;
            }
          }
        }

        if (chipToDelete) {
          e.preventDefault();
          chipToDelete.remove();
        }
      });
    }

    function refreshCellView(cell, raw, entry, field) {
      if (raw && raw.trim()) {
        cell.innerHTML = renderContent(raw);
        cell.classList.remove('placeholder');
        cell.querySelectorAll('.cell-img').forEach(img => {
          registerImg(img, () => {
            deleteStorageImg(img.src);
            img.remove();
            const newRaw = cellDomToRaw(cell);
            cell.dataset.raw = newRaw;
            if (entry) entry[field] = newRaw;
            refreshCellView(cell, newRaw, entry, field);
            if (entry) saveEntry(entry);
          });
        });
      } else {
        cell.innerHTML = '';
        cell.classList.add('placeholder');
      }
    }

    function makeTableCell(entry, field) {
      const cell = document.createElement('div');
      cell.className = 'cell-view';
      cell.contentEditable = 'true';
      cell.spellcheck = false;
      cell.dataset.raw = entry[field] || '';
      refreshCellView(cell, entry[field] || '', entry, field);

      addChipInput(cell);

      // 이미지 클릭 시 셀 포커스 방지 (이미지 핸들러만 동작)
      cell.addEventListener('mousedown', e => {
        if (e.target.tagName === 'IMG') e.preventDefault();
      });

      // 블러: DOM → raw 변환 후 저장
      cell.addEventListener('blur', async () => {
        const raw = cellDomToRaw(cell);
        cell.dataset.raw = raw;
        entry[field] = raw;
        refreshCellView(cell, raw, entry, field);
        await saveEntry(entry);
      });

      // 이미지 붙여넣기
      cell.addEventListener('paste', async e => {
        const imgItem = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith('image/'));
        if (!imgItem) return;
        e.preventDefault();
        setStatus('saving');
        try {
          const url = await uploadImage(imgItem.getAsFile());
          const img = document.createElement('img');
          img.src = url;
          img.className = 'cell-img';
          img.style.cssText = 'max-width:100%;max-height:280px;display:block;margin:4px 0;border-radius:3px;cursor:pointer;';
          registerImg(img, () => {
            deleteStorageImg(img.src);
            img.remove();
            const newRaw = cellDomToRaw(cell);
            cell.dataset.raw = newRaw;
            entry[field] = newRaw;
            refreshCellView(cell, newRaw, entry, field);
            saveEntry(entry);
          });
          insertImgAtCursor(img, cell);
          const raw = cellDomToRaw(cell);
          cell.dataset.raw = raw;
          entry[field] = raw;
          await saveEntry(entry);
        } catch(err) { console.error(err); setStatus('error'); }
      });

      return cell;
    }

    async function saveEntry(entry) {
      setStatus('saving');
      const row = {
        id: entry.id,
        month: entry.month,
        macro: entry.macro || '',
        company: entry.company || '',
        top_pick: entry.topPick || '',
        watchlist: entry.watchlist || '',
        order: entry.order
      };
      const { error } = await db.from('entries').upsert(row, { onConflict: 'id' });
      error ? setStatus('error') : setStatus('saved');
    }

    async function addMonthRow() {
      const suggested = getNextMonth();
      const month = prompt('추가할 월을 입력하세요:', suggested);
      if (!month) return;

      const order = entries.length;
      const row = { month: month.trim(), macro: '', company: '', top_pick: '', watchlist: '', order };
      setStatus('saving');
      const { data, error } = await db.from('entries').insert(row).select().single();
      if (error) { setStatus('error'); return; }

      entries.push({ id: data.id, month: data.month, macro: '', company: '', topPick: data.top_pick || '', watchlist: '', order });
      renderTable();
      setStatus('saved');
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function deleteEntry(id) {
      if (!confirm('이 행을 삭제할까요?')) return;
      setStatus('saving');
      const { error } = await db.from('entries').delete().eq('id', id);
      if (error) { setStatus('error'); return; }
      entries = entries.filter(e => e.id !== id);
      renderTable();
      setStatus('saved');
    }

    function getNextMonth() {
      if (entries.length === 0) {
        const d = new Date();
        return `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
      }
      const last = entries[entries.length - 1].month;
      const match = last.match(/(\d{4})년\s*(\d{1,2})월/);
      if (match) {
        let y = parseInt(match[1]), m = parseInt(match[2]) + 1;
        if (m > 12) { m = 1; y++; }
        return `${y}년 ${m}월`;
      }
      return '';
    }

    async function loadEntries() {
      const { data, error } = await db.from('entries').select('*').order('order');
      if (error) { console.error(error); return; }
      entries = data.map(r => ({ id: r.id, month: r.month, macro: r.macro || '', company: r.company || '', topPick: r.top_pick || '', watchlist: r.watchlist || '', order: r.order }));
      renderTable();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━
    //  컬럼 너비 드래그 조절
    // ━━━━━━━━━━━━━━━━━━━━━━
    // 기본 너비 (픽셀) — localStorage에 저장됨
    const DEFAULT_WIDTHS = [null, null, null]; // 가변 너비 (auto)
    // 버전 업: 이전 저장값 초기화
    const COL_VER = 'v4';
    if (localStorage.getItem('dashColVer') !== COL_VER) {
      localStorage.removeItem('dashColWidths');
      localStorage.setItem('dashColVer', COL_VER);
    }
    let colWidths = JSON.parse(localStorage.getItem('dashColWidths') || 'null') || [...DEFAULT_WIDTHS];

    function applyColWidths() {
      const cols = document.querySelectorAll('#tableColgroup col');
      [1,2].forEach(i => {
        if (colWidths[i]) cols[i].style.width = colWidths[i] + 'px';
      });
    }

    function initResizers() {
      document.querySelectorAll('.col-resizer').forEach(handle => {
        handle.addEventListener('mousedown', e => {
          e.preventDefault();
          const colIdx = parseInt(handle.dataset.col);
          const startX = e.clientX;
          // 현재 실제 렌더링된 너비 기준으로 드래그
          const th = handle.closest('th');
          const startW = th ? th.offsetWidth : (colWidths[colIdx] || 200);
          handle.classList.add('dragging');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';

          function onMove(e) {
            const diff = e.clientX - startX;
            colWidths[colIdx] = Math.max(80, startW + diff);
            applyColWidths();
          }
          function onUp() {
            handle.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            localStorage.setItem('dashColWidths', JSON.stringify(colWidths));
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      });
    }

    // ── 백업 ──
    async function backupAll() {
      const btn = document.querySelector('.backup-btn');
      btn.textContent = '이미지 수집 중...'; btn.disabled = true;
      try {
        const [tl, en, sn] = await Promise.all([
          db.from('timeline').select('*'),
          db.from('entries').select('*').order('order'),
          db.from('study_notes').select('*'),
        ]);
        const data = {
          exported_at: new Date().toISOString(),
          timeline:    tl.data  || [],
          entries:     en.data  || [],
          study_notes: sn.data  || [],
        };

        // ── 이미지 URL 수집 ──
        const imgUrls = new Set();
        data.study_notes.forEach(n => {
          if (!n.content) return;
          for (const m of n.content.matchAll(/<img[^>]+src="([^"]+)"/g)) imgUrls.add(m[1]);
        });
        data.entries.forEach(e => {
          ['macro','company','top_pick'].forEach(f => {

        add(15, '연말 북클로징: 헤지·액티브펀드 포지션 정리', 'f', { a: 1 });
        let close = 30; while (new Date(y, 11, close).getDay() % 6 === 0) close--;
        add(close, '韓 연말 폐장(12/31 휴장)', 'f');
        add(25, '美·韓 크리스마스 휴장', 'f');
      }
      if (m === 10) add(nthWeekday(y, 10, 4, 4), '美 추수감사절 휴장(익일 조기폐장)', 'f');

      // 2027 PCE·2028년 이후 고용보고서는 공식 일정 전이라 규칙으로 예상
      if (y >= 2027) add(lastWeekday(y, m, 5), '美 PCE', 'm', { a: 1 });
      if (y >= 2028) add(nthWeekday(y, m, 5, 1), '美 고용보고서', 'm', { a: 1 });
      return ev;
    }

    function calEventsFor(y, m) {
      const prefix = `${y}-${CAL_PAD(m + 1)}-`;
      const ev = CAL_FIXED.filter(e => e.d.startsWith(prefix));
      ev.push(...calRuleEvents(y, m));
      CAL_MISC.filter(e => e.m === m).forEach(e => ev.push({
        d: calKey(y, m, e.d),
        end: e.e ? calKey(y, e.e[0], e.e[1]) : undefined,
        t: e.t, c: e.c, a: 1,
      }));
      const order = { m: 0, x: 1, e: 2, f: 3 };
      return ev.sort((a, b) => a.d.localeCompare(b.d) || order[a.c] - order[b.c]);
    }

    function calDateLabel(e) {
      const [, mm, dd] = e.d.split('-').map(Number);
      let s = `${mm}/${dd}`;
      if (e.end) {
        const [, m2, d2] = e.end.split('-').map(Number);
        s += m2 === mm ? `-${d2}` : `-${m2}/${d2}`;
      }
      return (e.a ? '~' : '') + s;
    }

    // ── 일정 DB (Supabase calendar_events) ──
    // 표시 기간(이번 달부터 12개월)만 읽어오므로 화면을 열 때마다 1회, 100~150건 정도만 조회
    // CAL_DB가 null이면(조회 실패·빈 표) 위의 내장 일정으로 대신 표시
    let CAL_DB = null, calLoadedAt = 0;
    const CAL_ORDER = { m: 0, x: 1, e: 2, f: 3 };
    async function loadCalendarDb() {
      const now = new Date();
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 12, 0);
      const from = calKey(now.getFullYear(), now.getMonth(), 1);
      const to = calKey(lastDay.getFullYear(), lastDay.getMonth(), lastDay.getDate());
      try {
        const { data, error } = await db.from('calendar_events')
          .select('id,event_date,end_date,title,category,approx')
          .gte('event_date', from).lte('event_date', to).order('event_date');
        if (error) throw error;
        CAL_DB = data.length ? data.map(r => ({
          id: r.id, d: r.event_date, end: r.end_date || undefined, t: r.title, c: r.category, a: r.approx,
        })) : null;
      } catch (e) {
        console.error('캘린더 일정 로드 실패:', e);
        CAL_DB = null;
      }
      calLoadedAt = Date.now();
      const src = document.getElementById('calSrc');
      if (src) src.textContent = CAL_DB ? '' : '⚠ DB 연결 실패 — 내장 일정 표시 중(수정 불가)';
    }
    function calEventsView(y, m) {
      if (!CAL_DB) return calEventsFor(y, m);
      const prefix = `${y}-${CAL_PAD(m + 1)}-`;
      return CAL_DB.filter(e => e.d.startsWith(prefix))
        .sort((a, b) => a.d.localeCompare(b.d) || CAL_ORDER[a.c] - CAL_ORDER[b.c]);
    }

    // ── 일정 추가/수정/삭제 ──
    let calEditId = null;

      calEditId = ev ? ev.id : null;
      const now = new Date();
      $cal('calModalTitle').textContent = ev ? '일정 수정' : '일정 추가';
      $cal('calStart').value = ev ? ev.d : calKey(now.getFullYear(), now.getMonth(), now.getDate());

    async function afterCalChange() {

    async function saveCalEvent() {
      const d = $cal('calStart').value, end = $cal('calEnd').value, t = $cal('calTitle').value.trim();
      if (!d || !t) { $cal('calErr').textContent = '시작일과 내용을 입력해주세요.'; return; }
      if (end && end < d) { $cal('calErr').textContent = '종료일이 시작일보다 빠릅니다.'; return; }
      const row = { event_date: d, end_date: end || null, title: t, category: $cal('calCat').value, approx: $cal('calApprox').checked, updated_at: new Date().toISOString() };
      setStatus('saving');
      const { error } = calEditId
        ? await db.from('calendar_events').update(row).eq('id', calEditId)
        : await db.from('calendar_events').insert(row);
      if (error) { console.error(error); $cal('calErr').textContent = '저장 실패: ' + error.message; setStatus('error'); return; }

    async function deleteCalEvent() {
      if (!calEditId || !confirm('이 일정을 삭제할까요?')) return;
      setStatus('saving');
      const { error } = await db.from('calendar_events').delete().eq('id', calEditId);
      if (error) { console.error(error); $cal('calErr').textContent = '삭제 실패: ' + error.message; setStatus('error'); return; }

    let calStamp = '';
    function renderCalendar() {
      const grid = document.getElementById('calGrid');
      if (!grid) return;
      const now = new Date();
      const todayKey = calKey(now.getFullYear(), now.getMonth(), now.getDate());
      calStamp = todayKey;
      grid.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const dt = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const y = dt.getFullYear(), m = dt.getMonth();
        const cell = document.createElement('div');
        cell.className = 'cal-cell' + (i === 0 ? ' now' : '');

        head.appendChild(yr);
        cell.appendChild(head);
        calEventsView(y, m).forEach(e => {
          const row = document.createElement('div');
          const last = e.end || e.d;
          row.className = `cal-ev ${e.c}` + (last < todayKey ? ' past' : '') + (e.d <= todayKey && todayKey <= last ? ' today' : '');
          row.addEventListener('click', () => openCalEditor(e));
          const d = document.createElement('span');
          d.className = 'd';
          d.textContent = calDateLabel(e);
          row.appendChild(d);
          row.appendChild(document.createTextNode(e.t));
          cell.appendChild(row);
        });

      }

    // 앱을 켜둔 채 날짜가 바뀌거나, 1분 넘게 자리를 비웠다 돌아오면 일정을 다시 불러와 그림
    document.addEventListener('visibilitychange', async () => {

        renderCalendar();
      }
    });

    let _imgToolbar = null, _imgHandle = null, _imgSel = null;

    function closeImgUI() {
      _imgToolbar?.remove();  _imgToolbar = null;
      _imgHandle?.remove();   _imgHandle  = null;
      if (_imgSel) { _imgSel.classList.remove('img-selected'); _imgSel = null; }
    }

    function placeImgUI(img) {
      const r = img.getBoundingClientRect();
      if (_imgToolbar) {
        const bh = _imgToolbar.offsetHeight || 32, bw = _imgToolbar.offsetWidth || 180;
        let top  = r.top - bh - 6; if (top < 4) top = r.bottom + 4;
        let left = r.left;         if (left + bw > innerWidth - 4) left = innerWidth - bw - 4;
        _imgToolbar.style.top  = top  + 'px';
        _imgToolbar.style.left = left + 'px';
      }
      if (_imgHandle) {
        _imgHandle.style.top  = (r.bottom - 7) + 'px';
        _imgHandle.style.left = (r.right  - 7) + 'px';
      }
    }

    // img 클릭 시 툴바 + 리사이즈 핸들 표시

      _imgSel = img;

      // 툴바
      const bar = document.createElement('div');

      };
      viewBtn.onclick = openLightbox;
      viewBtn.addEventListener('touchend', openLightbox);
      bar.appendChild(viewBtn);

      // 모바일 크기 조절 버튼 (터치 기기에서만 보임)

      sep0.className = 'img-size-btn';

      const mkSizeBtn = (label, delta) => {

        btn.className = 'img-size-btn';
        btn.style.cssText = 'font-size:16px;padding:2px 8px;';

          e.stopPropagation(); e.preventDefault();

          img.style.width = Math.max(40, cur + delta) + 'px';
          img.style.height = 'auto';
          img.closest('.free-note-area, .cell-view')?.dispatchEvent(new Event('blur'));
        };
        btn.onclick = doResize;
        btn.addEventListener('touchend', doResize);
        bar.appendChild(btn);
      };
      mkSizeBtn('−', -30);
      mkSizeBtn('＋', 30);

      if (onDelete) {
        const sep = document.createElement('span');
        sep.style.cssText = 'width:1px;background:#444;margin:2px 4px;align-self:stretch;display:inline-block;';
        bar.appendChild(sep);
        const delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.className = 'del';
        delBtn.onmousedown = e => e.preventDefault();
        const doDelete = e => { e.stopPropagation(); e.preventDefault(); closeImgUI(); onDelete(img); };
        delBtn.onclick = doDelete;
        delBtn.addEventListener('touchend', doDelete);
        bar.appendChild(delBtn);
      }
      document.body.appendChild(bar);

      // 리사이즈 핸들
      const handle = document.createElement('div');
      handle.className = 'img-resize-handle';
      _imgHandle = handle;
      document.body.appendChild(handle);
      requestAnimationFrame(() => placeImgUI(img));

      // 마우스 리사이즈
      handle.addEventListener('mousedown', ev => {
        ev.preventDefault(); ev.stopPropagation();
        const startX = ev.clientX, startW = img.offsetWidth || 200;
        document.body.style.cursor = 'nwse-resize';
        document.body.style.userSelect = 'none';
        const onMove = mv => {
          img.style.width = Math.max(40, startW + mv.clientX - startX) + 'px';
          img.style.height = 'auto';
          requestAnimationFrame(() => placeImgUI(img));
        };
        const onUp = () => {
          document.body.style.cursor = document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          img.closest('.free-note-area, .cell-view')?.dispatchEvent(new Event('blur'));
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      // 터치 리사이즈 (아이폰/아이패드)
      handle.addEventListener('touchstart', ev => {
        ev.preventDefault(); ev.stopPropagation();
        const t0 = ev.touches[0];
        const startX = t0.clientX, startW = img.offsetWidth || 200;
        const onMove = mv => {
          const t = mv.touches[0];
          img.style.width = Math.max(40, startW + t.clientX - startX) + 'px';
          img.style.height = 'auto';
          requestAnimationFrame(() => placeImgUI(img));
        };
        const onUp = () => {
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onUp);
          img.closest('.free-note-area, .cell-view')?.dispatchEvent(new Event('blur'));
        };
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
      }, { passive: false });
    }

    //  자유노트 공통 유틸
    // ════════════════════════════════════════════════════════
    function compressBlob(blob, maxPx = 600) {
      return new Promise(resolve => {
        const url = URL.createObjectURL(blob);
        const tmp = new Image();
        tmp.onload = () => {
          let w = tmp.width, h = tmp.height;
          if (w > maxPx || h > maxPx) {
            if (w >= h) { h = Math.round(h * maxPx / w); w = maxPx; }
            else        { w = Math.round(w * maxPx / h); h = maxPx; }
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(tmp, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.70));
        };
        tmp.src = url;
      });
    }

    // 이미 있는 data URL을 더 작게 재압축
    function recompressDataUrl(dataUrl, maxPx, quality) {
      return new Promise(resolve => {
        const tmp = new Image();
        tmp.onload = () => {
          let w = tmp.width, h = tmp.height;
          if (w > maxPx || h > maxPx) {
            if (w >= h) { h = Math.round(h * maxPx / w); w = maxPx; }
            else        { w = Math.round(w * maxPx / h); h = maxPx; }
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(tmp, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        tmp.onerror = () => resolve(dataUrl); // 실패 시 원본 유지
        tmp.src = dataUrl;
      });
    }

    // 커서 위치에 이미지 삽입, 이미지 뒤에 커서 유지
    function insertImgAtCursor(imgEl, area) {
      const sel = window.getSelection();
      if (sel?.rangeCount) {
        const r = sel.getRangeAt(0);
        r.deleteContents();
        // 이미지 뒤에 커서를 고정할 빈 텍스트 노드
        const after = document.createTextNode('​');
        r.insertNode(after);
        r.insertNode(imgEl);
        r.setStartAfter(after);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        area.appendChild(imgEl);
      }
    }

    // 노트 로드 후 기존 이미지에 핸들러 재연결 + URL 텍스트 → 클릭 가능 span 변환
    function reattachNoteImgs(area) {
      area.querySelectorAll('img').forEach(img => {
        registerImg(img, i => { deleteStorageImg(i.src); i.remove(); area.dispatchEvent(new Event('blur')); });
      });
      linkifyNoteUrls(area);
    }

    function linkifyNoteUrls(area) {
      // 1. 이미 저장된 .cell-link span에 onclick 재연결
      // (innerHTML 저장 시 DOM 이벤트 프로퍼티가 날아가는 문제 방지)
      area.querySelectorAll('span.cell-link').forEach(span => {
        const url = span.textContent.trim();
        if (!url) return;
        const safe = url.replace(/'/g, '%27');
        span.onclick = e => { e.stopPropagation(); e.preventDefault(); window.open(safe, '_blank', 'noopener'); };
      });

      // 2. 텍스트 노드에 남은 plain URL → 클릭 가능 span으로 변환
      const walker = document.createTreeWalker(area, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) {
        if (n.parentElement?.classList.contains('cell-link')) continue;
        if (n.parentElement?.classList.contains('chip')) continue;
        if (/https?:\/\//.test(n.textContent)) nodes.push(n);
      }
      nodes.forEach(textNode => {
        const text = textNode.textContent;
        const re = /(https?:\/\/[^\s<>"]+)/g;
        let lastIdx = 0, m;
        const frag = document.createDocumentFragment();
        let found = false;
        while ((m = re.exec(text)) !== null) {
          if (m.index > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
          const url = m[1];
          const safe = url.replace(/'/g, '%27');
          const span = document.createElement('span');
          span.className = 'cell-link';
          span.contentEditable = 'false';
          span.textContent = url;
          span.onclick = e => { e.stopPropagation(); e.preventDefault(); window.open(safe, '_blank', 'noopener'); };
          frag.appendChild(span);
          lastIdx = m.index + m[0].length;
          found = true;
        }
        if (!found) return;
        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
        textNode.parentNode.replaceChild(frag, textNode);
      });
    }

    // ════════════════════════════════════════════════════════
    //  자유노트 초기화 (noteId, statusId, supabaseId)
    // ════════════════════════════════════════════════════════
    function initNote(noteId, statusId, supabaseId) {
      const area = document.getElementById(noteId);
      const sts  = document.getElementById(statusId);

      function showStatus(state, msg) {
        sts.className = 'free-note-status' + (state ? ' ' + state : '');
        sts.textContent = msg || '';
        if (state === 'saved') setTimeout(() => { sts.textContent = ''; sts.className = 'free-note-status'; }, 1800);
      }

      async function save() {
        showStatus('saving', '저장 중...');
        processChips(area); // [text] → 칩 span 변환

        try {
          const { error } = await db.from('study_notes').upsert({ id: supabaseId, content: area.innerHTML, updated_at: new Date().toISOString() });
          if (error) throw error;
          showStatus('saved', '✓');
        } catch(e) {
          console.error('노트 저장 실패:', e);
          showStatus('error', '저장 실패');
        }
      }

      async function load() {
        try {
          const { data, error } = await db.from('study_notes').select('content').eq('id', supabaseId).single();
          if (error && error.code !== 'PGRST116') { console.error('노트 로드 실패:', error); return; }
          if (data?.content) { area.innerHTML = data.content; reattachNoteImgs(area); }
        } catch(e) { console.error('노트 로드 에러:', e); }
      }

      addChipInput(area);

      // Enter → <br> (Chrome의 <div> 자동생성 방지 → float 텍스트 흐름 유지)
      area.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const sel = window.getSelection();
        if (!sel?.rangeCount) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const br = document.createElement('br');
        range.insertNode(br);
        range.setStartAfter(br);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      });

      area.addEventListener('blur', save);

      area.addEventListener('paste', async e => {
        const imgItem = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith('image/'));
        if (!imgItem) return;
        e.preventDefault();
        const blob = imgItem.getAsFile();
        if (!blob) return;
        showStatus('saving', '이미지 처리 중...');
        try {
          const img = document.createElement('img');
          img.src = await uploadImage(blob);
          registerImg(img, i => { deleteStorageImg(i.src); i.remove(); area.dispatchEvent(new Event('blur')); });
          insertImgAtCursor(img, area);
          await save();
        } catch(err) { console.error(err); showStatus('', ''); }
      });

      load();
    }

    // ════════════════════════════════════════════════════════
    //  미국 국채 금리 차트 (FRED: 10년·2년·3개월)
    //  Supabase 함수 fred-rates가 FRED에서 받아 넘겨준다(API 키는 함수 비밀값).
    //  처음엔 최근 10년치만 받고, '전체'를 누를 때 1962년부터 다시 받는다.
    // ════════════════════════════════════════════════════════
    const RATE_SERIES = [
      { id: 'DGS10',  name: '10년',  color: '#3987e5' },
      { id: 'DGS2',   name: '2년',   color: '#d95926' },
      { id: 'DGS3MO', name: '3개월', color: '#199e70' },
    ];
    // [코드, 버튼 글자, 개월 수(0 = 전체)]
    const RATE_RANGES = [
      ['1Y', '1년', 12], ['3Y', '3년', 36], ['5Y', '5년', 60], ['10Y', '10년', 120], ['ALL', '전체', 0],
    ];
    const ratesData = { recent: null, full: null };
    let ratesRange = '1Y';
    try { ratesRange = localStorage.getItem('ratesRange') || '1Y'; } catch (e) {}
    if (!RATE_RANGES.some(r => r[0] === ratesRange)) ratesRange = '1Y';
    let ratesPlot = null, ratesView = null;

    async function fetchRates(full) {
      const key = full ? 'full' : 'recent';
      if (ratesData[key]) return ratesData[key];
      const start = new Date();
      start.setMonth(start.getMonth() - 121);
      const { data, error } = await db.functions.invoke('fred-rates', {
        body: full ? {} : { start: start.toISOString().slice(0, 10) },
      });
      if (error) {
        let msg = error.message;
        try { const j = await error.context.json(); if (j?.error) msg = j.error; } catch (e) {}
        throw new Error(msg);
      }
      return (ratesData[key] = data);
    }

    function renderRateButtons() {
      const box = document.getElementById('ratesRange');
      box.innerHTML = '';
      for (const [code, label] of RATE_RANGES) {
        const b = document.createElement('button');
        b.textContent = label;
        if (code === ratesRange) b.className = 'on';
        b.onclick = () => {
          ratesRange = code;
          try { localStorage.setItem('ratesRange', code); } catch (e) {}
          loadRates();
        };
        box.appendChild(b);
      }
    }

    async function loadRates() {
      renderRateButtons();
      try {
        drawRates(await fetchRates(ratesRange === 'ALL'));
      } catch (e) {
        console.error('금리 데이터 로드 실패:', e);
        if (ratesPlot) { ratesPlot.destroy(); ratesPlot = null; }
        const msg = document.createElement('div');
        msg.className = 'rates-msg';
        msg.textContent = '금리 데이터를 불러오지 못했어요 (' + (e.message || e) + ')';
        document.getElementById('ratesChart').replaceChildren(msg);
      }
    }

    // 눈금 간격(0.25 등)을 반올림 없이 보여줄 소수 자릿수
    function rateDecimals(incr) {
      for (let d = 0; d < 3; d++) if (Math.abs(Math.round(incr * 10 ** d) - incr * 10 ** d) < 1e-6) return d;
      return 2;
    }

    function ratesOpts(width, height) {
      const axis = {
        stroke: '#777', font: '11px -apple-system, BlinkMacSystemFont, sans-serif',
        grid: { stroke: '#262626', width: 1 }, ticks: { show: false },
      };
      const DAY = 86400;
      return {
        width, height,
        legend: { show: false },
        cursor: { drag: { x: false, y: false }, points: { size: 8 } },
        tzDate: ts => uPlot.tzDate(new Date(ts * 1e3), 'Etc/UTC'),
        scales: { x: { time: true } },
        axes: [
          { ...axis, space: 60, values: (u, splits, ai, space, incr) => splits.map(s => {
              const d = new Date(s * 1e3), y = d.getUTCFullYear(), m = d.getUTCMonth() + 1;
              if (incr >= 300 * DAY) return String(y);
              if (incr >= 28 * DAY) return `${String(y).slice(2)}.${m}`;
              return `${m}/${d.getUTCDate()}`;
            }) },
          { ...axis, size: 46, values: (u, splits, ai, space, incr) =>
              splits.map(v => v.toFixed(rateDecimals(incr)) + '%') },
        ],
        series: [{}, ...RATE_SERIES.map(s => ({
          label: s.name, stroke: s.color, width: 1, spanGaps: true, points: { show: false },
        }))],
        hooks: { setCursor: [u => ratesLegend(u.cursor.idx)] },
      };
    }

    function drawRates(data) {
      const months = RATE_RANGES.find(r => r[0] === ratesRange)[2];
      let from = 0;
      if (months) {
        const cut = new Date(data.dates[data.dates.length - 1]);
        cut.setMonth(cut.getMonth() - months);
        from = Math.max(0, data.dates.findIndex(d => d >= cut.toISOString().slice(0, 10)));
      }
      const dates = data.dates.slice(from);
      const ys = RATE_SERIES.map(s => data.series[s.id].slice(from));
      const plotData = [dates.map(d => Date.parse(d) / 1000), ...ys];
      ratesView = { dates, ys };

      const box = document.getElementById('ratesChart');
      if (ratesPlot) {
        ratesPlot.setData(plotData);
      } else {
        box.replaceChildren();
        ratesPlot = new uPlot(ratesOpts(box.clientWidth, box.clientHeight), plotData, box);
        new ResizeObserver(() => {
          if (ratesPlot) ratesPlot.setSize({ width: box.clientWidth, height: box.clientHeight });
        }).observe(box);
      }
      ratesLegend(null);
    }

    // 범례 = 값 표시줄. 커서가 없으면 가장 최근 값, 있으면 그날 값.
    function ratesLegend(idx) {
      if (!ratesView) return;
      const { dates, ys } = ratesView;
      const i = idx ?? dates.length - 1;
      // 휴일처럼 그날 값이 비어 있으면 직전 값을 쓴다
      const val = k => { for (let j = i; j >= 0; j--) if (ys[k][j] != null) return ys[k][j]; return null; };
      const v = RATE_SERIES.map((s, k) => val(k));
      const pct = x => x == null ? '–' : x.toFixed(2) + '%';
      const spread = (label, a, b) => {
        if (a == null || b == null) return '';
        const d = a - b;
        return `<span>${label} <b>${d >= 0 ? '+' : ''}${d.toFixed(2)}%p</b>${d < 0 ? '<span class="inv">역전</span>' : ''}</span>`;
      };
      document.getElementById('ratesLegend').innerHTML =
        `<span class="date">${dates[i]}</span>` +
        RATE_SERIES.map((s, k) => `<span><i style="background:${s.color}"></i>${s.name} <b>${pct(v[k])}</b></span>`).join('') +
        spread('10년-2년', v[0], v[1]) + spread('10년-3개월', v[0], v[2]);
    }

    // ════════════════════════════════════════════════════════
    //  로그인 (이메일 + 비밀번호)
    //  로그인 전에는 대시보드를 숨기고 DB 요청도 보내지 않는다.
    //  세션은 Supabase가 브라우저에 저장하고 자동 갱신 → 기기마다 1회만 로그인.
    // ════════════════════════════════════════════════════════
    function startApp() {
      loadCalendarDb().finally(renderCalendar);
      loadRates();
      // 자유노트 두 개 초기화
      initNote('free-note',  'note-status',  'freenote');
      initNote('free-note2', 'note-status2', 'freenote2');
      init();
    }

    // 이벤트 리스너 중복 방지: 앱은 페이지당 한 번만 시작한다.
    let appStarted = false;
    function handleAuthState(session) {
      const logoutBtn = document.getElementById('logoutBtn');
      if (session) {
        document.getElementById('authView').classList.remove('on');
        document.getElementById('appRoot').style.display = '';
        logoutBtn.style.display = '';
        if (!appStarted) {
          appStarted = true;
          // onAuthStateChange 콜백 안에서 바로 DB를 부르면 막힐 수 있어 한 틱 뒤에 시작
          setTimeout(startApp, 0);
        }
      } else {
        // 로그아웃·세션 만료: 시작된 앱은 새로고침으로 깨끗하게 되돌린다.
        if (appStarted) { location.reload(); return; }
        document.getElementById('appRoot').style.display = 'none';
        document.getElementById('authErr').textContent = '';
        document.getElementById('authView').classList.add('on');
      }
    }

    async function checkAuthAndInit() {
      const { data: { session } } = await db.auth.getSession();
      handleAuthState(session);
      db.auth.onAuthStateChange((_event, newSession) => handleAuthState(newSession));
    }

    async function loginWithPassword() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authErr');
      if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
      errEl.textContent = '로그인 중...';
      try {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) { errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.'; return; }
        errEl.textContent = '';
        // 성공하면 onAuthStateChange가 화면 전환을 처리한다.
      } catch (e) { errEl.textContent = '로그인 실패: ' + (e.message || e); }
    }

    async function logout() {
      if (!confirm('로그아웃 하시겠어요?')) return;
      await db.auth.signOut();
    }

    document.getElementById('authPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); loginWithPassword(); }
    });
    document.getElementById('authEmail').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('authPassword').focus(); }
    });

    checkAuthAndInit();
  </script>
</body>
</html>
