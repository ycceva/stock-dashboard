# 매주 금요일 장 마감 뒤(한국 시간 17:00) 전 종목 주봉을 다시 받아 data/weekly.json을 갱신한다.
# 깃허브 Actions 화면에서 "Run workflow"를 누르면 언제든 바로 돌릴 수 있다.
name: 주봉 골든크로스 스캔

on:
  schedule:
    - cron: "0 8 * * 5"   # UTC 08:00 = 한국 17:00, 금요일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scanner/scan_golden_cross.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly.json
          git diff --cached --quiet || git commit -m "주봉 골든크로스 스캔 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
